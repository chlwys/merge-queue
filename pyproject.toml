[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "merge-queue"
version = "0.1.2"
description = "Deterministic local merge queue for Git repositories, with a global MCP completion adapter"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Ordinary core commands use the standard library; pending CLI waits lazily load watchfiles.
# The MCP adapter also needs fastmcp and mcp.
dependencies = [
    "fastmcp==4.1.3",
    "mcp==2.3.0",
    "watchfiles==1.3.0",
]

[project.scripts]
merge-queue = "merge_queue.core:cli"
merge-queue-mcp = "merge_queue.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/merge_queue"]

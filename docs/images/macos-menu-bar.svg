<svg xmlns="http://www.w3.org/2000/svg" width="390" height="500" viewBox="0 0 390 500" role="img" aria-labelledby="title description">
<title id="title">Earth-to-station Merge Queue menu-bar app</title>
<desc id="description">Orbital theme illustration. Waiting requests are counted on Earth; a rocket carries active work toward a station built by completed merges. Hover or click the station for completed work, Earth for waiting work, and temporary debris for failures. The panel shows elapsed time, an estimated time to clear work, and a bottom repository selector.</desc>
